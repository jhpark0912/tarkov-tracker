server:
  port: 8090

spring:
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:file:${user.dir}/data/tarkov-helper;AUTO_SERVER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false

jwt:
  secret: tarkov-helper-jwt-secret-key-for-development-only-change-in-production
  expiration: 86400000

tarkov:
  api:
    url: https://api.tarkov.dev/graphql
  sync:
    cron: "0 0 3 1 * *"  # 매월 1일 03시 (게임 패치 시 POST /api/v1/admin/sync로 수동 트리거)
    enabled: true

logging:
  level:
    com.tarkov.helper: DEBUG
