server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:file:./data/tarkov-helper
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: tarkov-helper-jwt-secret-key-for-development-only-change-in-production
  expiration: 86400000

tarkov:
  api:
    url: https://api.tarkov.dev/graphql
  sync:
    cron: "0 0 */24 * * *"
    enabled: true

logging:
  level:
    com.tarkov.helper: DEBUG
