spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-characters-long-for-hmac-sha256
  expiration: 3600000

tarkov:
  api:
    url: https://api.tarkov.dev/graphql
  sync:
    cron: "-"
    enabled: false

logging:
  level:
    com.tarkov.helper: WARN
